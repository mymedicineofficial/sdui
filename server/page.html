<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Page not found • My Medicine</title>
<link rel="icon" href="https://i.postimg.cc/X7LfYHbx/applogo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#000000;
  --bg:#0a0a0a;
  --surface:#121212;
  --surface2:#181818;
  --surface3:#242424;
  --hover:#2a2a2a;
  --border:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.05);
  --green:#1db954;
  --green-bright:#1ed760;
  --text:#ffffff;
  --muted:#b3b3b3;
  --muted2:#727272;
  --font-head:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;flex-direction:column;
}
h1,h2{font-family:var(--font-head);margin:0}
p{margin:0}
a,button{cursor:pointer;text-decoration:none;color:inherit;font:inherit}
:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* header */
.head{
  display:flex;align-items:center;gap:11px;padding:22px 28px;
}
.head img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.head span{font-family:var(--font-head);font-weight:800;font-size:16px;letter-spacing:-.3px}

/* main */
.wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px 24px 60px;
}
.card{
  width:100%;max-width:560px;text-align:center;position:relative;
}

/* pulse / vitals mark instead of a generic "404" numeral block */
.mark{
  width:100%;height:96px;margin:0 auto 8px;
  display:block;
}
.mark path{
  fill:none;stroke:var(--green);stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:600;stroke-dashoffset:600;
  animation:draw 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mark path{stroke-dashoffset:0;animation:none}}

.eyebrow{color:var(--green-bright);font-weight:700;font-size:12.5px;margin-top:18px}
h1{font-size:34px;line-height:1.15;letter-spacing:-.9px;font-weight:800;margin-top:12px}
.copy{margin-top:14px;color:var(--muted);font-size:14.5px;line-height:1.65;max-width:420px;margin-left:auto;margin-right:auto}
.path{
  margin-top:18px;display:inline-block;padding:8px 14px;border-radius:999px;
  background:var(--surface2);color:var(--muted2);font-size:12px;font-family:monospace,monospace;
  word-break:break-all;
}

.actions{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.btn-solid{
  background:var(--green);color:#04140a;font-weight:800;font-size:14px;
  padding:14px 26px;border-radius:999px;transition:transform .15s,background .15s;
}
.btn-solid:hover{background:var(--green-bright);transform:scale(1.03)}
.btn-outline{
  border:1px solid rgba(255,255,255,.35);color:var(--text);font-weight:800;font-size:14px;
  padding:14px 26px;border-radius:999px;transition:border-color .15s,background .15s;
}
.btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.06)}

.help{
  margin-top:40px;padding-top:28px;border-top:1px solid var(--border-soft);
  display:flex;flex-direction:column;gap:10px;
}
.help p{color:var(--muted2);font-size:12.5px}
.help a{color:var(--muted);font-size:13px;font-weight:700}
.help a:hover{color:var(--text)}

footer{padding:20px;color:var(--muted2);font-size:11.5px;text-align:center}

@media (max-width:520px){
  .head{padding:18px 20px}
  h1{font-size:26px}
  .actions{flex-direction:column}
  .btn-solid,.btn-outline{width:100%;text-align:center}
}
</style>
</head>
<body>

  <div class="head">
    <img src="https://i.postimg.cc/X7LfYHbx/applogo.jpg" alt="My Medicine">
    <span>My Medicine</span>
  </div>

  <div class="wrap">
    <div class="card">
      <svg class="mark" viewBox="0 0 300 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0 48 H70 L88 14 L112 82 L132 30 L148 60 L162 48 H300"/>
      </svg>

      <div class="eyebrow">Error 404</div>
      <h1>We couldn't find that page</h1>
      <p class="copy">The link may be broken, or the page may have moved. Let's get you back to browsing doctors and health articles.</p>
      <div class="path" id="brokenPath"></div>

      <div class="actions">
        <a class="btn-solid" href="index.html">Back to Home</a>
        <a class="btn-outline" href="index.html#doctors">Find Doctors</a>
      </div>

      <div class="help">
        <p>Still stuck?</p>
        <a href="index.html#how">See how appointments work</a>
      </div>
    </div>
  </div>

  <footer>© My Medicine · Healthcare, on demand</footer>

  <script>
    (function(){
      var el = document.getElementById('brokenPath');
      if (el && location.pathname) el.textContent = location.pathname;
      else if (el) el.style.display = 'none';
    })();
  </script>
</body>
</html>
